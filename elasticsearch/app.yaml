apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elasticsearch
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: elasticsearch

  sources:
    - repoURL: https://helm.elastic.co
      chart: elasticsearch
      targetRevision: 8.5.1
      helm:
        valueFiles:
          - $values/elasticsearch/values.yaml

    - repoURL: https://github.com/Pazeezz/gitops.git
      targetRevision: main
      ref: values

  # Ignore secret data fields — Helm regenerates random certs/passwords on every
  # render, causing perpetual OutOfSync even when nothing actually changed.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: elasticsearch-master-certs
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: elasticsearch-master-credentials
      jsonPointers:
        - /data/password

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
