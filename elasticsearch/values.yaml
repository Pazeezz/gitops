# ── Identity ──────────────────────────────────────────────────────────────────
clusterName: "elasticsearch"
nodeGroup: "master"

# ── Image ─────────────────────────────────────────────────────────────────────
image: "docker.elastic.co/elasticsearch/elasticsearch"
imageTag: "8.11.4"
imagePullPolicy: "IfNotPresent"

# ── Topology ──────────────────────────────────────────────────────────────────
# roles: [] prevents the chart from injecting cluster.initial_master_nodes.
# The chart's elasticsearch.endpoints helper always appends a trailing comma
# (e.g. "elasticsearch-master-0,") which ES 8.x rejects as a null-valued list
# entry. With an empty roles list the node.roles env var is also suppressed,
# so ES uses its default all-roles behaviour (master + data + ingest + ...).
# discovery.type=single-node (in extraEnvs) handles self-election without
# needing cluster.initial_master_nodes at all.
replicas: 1
minimumMasterNodes: 1

roles: []

# ── Protocol: http ────────────────────────────────────────────────────────────
# Setting protocol=http prevents the chart from injecting xpack.security.*
# env vars into the StatefulSet. Those env vars override esConfig and cannot
# be safely overridden via extraEnvs (causes duplicate-name patch conflict).
protocol: http
httpPort: 9200
transportPort: 9300

# ── Elasticsearch config file ─────────────────────────────────────────────────
esConfig:
  elasticsearch.yml: |
    xpack.security.enabled: false
    xpack.security.enrollment.enabled: false
    network.host: 0.0.0.0

# ── Environment variables ──────────────────────────────────────────────────────
# discovery.type=single-node: node self-elects without cluster.initial_master_nodes.
# ELASTIC_PASSWORD: required by the chart's readiness probe script.
# No duplicates of any chart-injected env var names here.
extraEnvs:
  - name: discovery.type
    value: "single-node"
  - name: ELASTIC_PASSWORD
    value: "changeme"

# ── JVM heap ──────────────────────────────────────────────────────────────────
esJavaOpts: "-Xmx512m -Xms512m"

# ── Resources ─────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: "100m"
    memory: "1Gi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

# ── Storage ───────────────────────────────────────────────────────────────────
persistence:
  enabled: true
  labels:
    enabled: false

volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi

# ── Certs: disabled ───────────────────────────────────────────────────────────
# createCert: false removes the cert Secret, the cert volume, and the cert
# volume mount from the StatefulSet — no FailedMount, no xpack SSL env vars.
createCert: false

# ── Credentials secret: disabled ──────────────────────────────────────────────
secret:
  enabled: false
  password: ""

# ── Scheduling ────────────────────────────────────────────────────────────────
antiAffinity: "soft"
antiAffinityTopologyKey: "kubernetes.io/hostname"
podManagementPolicy: "Parallel"

# ── Sysctls ───────────────────────────────────────────────────────────────────
sysctlInitContainer:
  enabled: true

# ── Service ───────────────────────────────────────────────────────────────────
service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 9200
      protocol: TCP
    - name: transport
      port: 9300
      protocol: TCP

# ── Disabled ──────────────────────────────────────────────────────────────────
rbac:
  create: false
podSecurityPolicy:
  create: false
ingress:
  enabled: false
