apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-azure
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak

  sources:
    - repoURL: https://codecentric.github.io/helm-charts
      chart: keycloakx
      targetRevision: 7.1.3
      helm:
        valueFiles:
          - $values/keycloak-azure/values.yaml

    - repoURL: https://github.com/Pazeezz/gitops.git
      targetRevision: main
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
