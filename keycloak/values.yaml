# ── Replica ───────────────────────────────────────────────────────
replicaCount: 1

# ── Image: quay.io/keycloak/keycloak (chart default, no override needed) ──

# ── Admin credentials ─────────────────────────────────────────────
args:
  - start-dev

extraEnv: |
  - name: KEYCLOAK_ADMIN
    value: admin
  - name: KEYCLOAK_ADMIN_PASSWORD
    value: admin
  - name: KC_PROXY
    value: edge

# ── External PostgreSQL ────────────────────────────────────────────
database:
  vendor: postgres
  hostname: keycloak-postgres
  port: 5432
  database: keycloak
  username: keycloak
  password: keycloak

# ── Resources ─────────────────────────────────────────────────────
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# ── Service ───────────────────────────────────────────────────────
service:
  type: ClusterIP
