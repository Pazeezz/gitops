# ── Replica ───────────────────────────────────────────────────────
replicaCount: 1

# ── Image: quay.io/keycloak/keycloak (chart default, no override needed) ──

# ── Admin credentials ─────────────────────────────────────────────
command:
  - start-dev

extraEnv: |
  - name: KEYCLOAK_ADMIN
    value: admin
  - name: KEYCLOAK_ADMIN_PASSWORD
    value: admin
  - name: KC_PROXY
    value: edge

# ── Resources ─────────────────────────────────────────────────────
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# ── Service ───────────────────────────────────────────────────────
service:
  type: ClusterIP
