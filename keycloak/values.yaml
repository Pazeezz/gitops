# ── Replica ───────────────────────────────────────────────────────
replicaCount: 1

# ── Image: quay.io/keycloak/keycloak (chart default, no override needed) ──

# ── Use modern Keycloak URL structure (no /auth prefix) ───────────
http:
  relativePath: "/"

# ── Admin credentials ─────────────────────────────────────────────
args:
  - start-dev
  - --cache=local

extraEnv: |
  - name: KEYCLOAK_ADMIN
    value: admin
  - name: KEYCLOAK_ADMIN_PASSWORD
    value: admin
  - name: KC_PROXY
    value: edge

# ── Startup probe: wait 40s before first check (augmentation takes ~23s) ──
startupProbe: |
  httpGet:
    path: /health
    port: http-internal
    scheme: HTTP
  initialDelaySeconds: 40
  timeoutSeconds: 5
  failureThreshold: 30
  periodSeconds: 5

# ── Resources ─────────────────────────────────────────────────────
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# ── Service ───────────────────────────────────────────────────────
service:
  type: ClusterIP
