server:
  replicaCount: 1

cassandra:
  enabled: true
  config:
    cluster_size: 1
    max_heap_size: 256M      # This overrides the hardcoded 512M
    heap_new_size: 64M
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  persistence:
    enabled: false

prometheus:
  enabled: false
grafana:
  enabled: false
elasticsearch:
  enabled: false