server:
  replicaCount: 1

cassandra:
  enabled: true
  config:
    cluster_size: 1
  ## Use extraEnv, not env - this is what the bitnami cassandra chart reads
  extraEnv:
    - name: MAX_HEAP_SIZE
      value: "512M"
    - name: HEAP_NEWSIZE
      value: "128M"
  resources:
    requests:
      memory: "1Gi"
      cpu: "200m"
    limits:
      memory: "2Gi"   # Must be > MAX_HEAP_SIZE + JVM overhead (~600MB extra)
      cpu: "1000m"
  persistence:
    enabled: false    # Keep false to avoid StatefulSet immutable field issues

prometheus:
  enabled: false

grafana:
  enabled: false

elasticsearch:
  enabled: false